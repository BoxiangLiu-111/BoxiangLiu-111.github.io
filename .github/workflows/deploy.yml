name: Deploy Academic Homepage to GitHub Pages

on:
  # Deploy every update to the main branch
  push:
    branches:
      - main

  # Allows you to trigger this workflow manually from the GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single build-and-deploy job
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Validate TypeScript
        run: pnpm run lint

      - name: Build Application with Vite
        run: pnpm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
