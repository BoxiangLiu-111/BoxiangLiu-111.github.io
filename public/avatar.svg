<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching studio photography backdrop -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Pinstripe Suit Gradient -->
    <linearGradient id="suitDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Tie Striped Gradient -->
    <linearGradient id="tiePattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="25%" stop-color="#1e3a8a" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="75%" stop-color="#1e3a8a" />
      <stop offset="80%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4d6" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#studioBg)" />

  <!-- Soft studio halo -->
  <circle cx="150" cy="130" r="110" fill="#ffffff" opacity="0.7" />

  <!-- Body / Shoulders in dark pinstripe suit jacket -->
  <g filter="url(#softShadow)">
    <path d="M 30 300 C 35 225, 95 195, 150 198 C 205 195, 265 225, 270 300 Z" fill="url(#suitDark)" />

    <!-- Fine pinstripes -->
    <line x1="75" y1="230" x2="65" y2="300" stroke="#475569" stroke-width="1.2" opacity="0.4" />
    <line x1="105" y1="215" x2="100" y2="300" stroke="#475569" stroke-width="1.2" opacity="0.4" />
    <line x1="130" y1="205" x2="128" y2="300" stroke="#475569" stroke-width="1.2" opacity="0.4" />
    <line x1="170" y1="205" x2="172" y2="300" stroke="#475569" stroke-width="1.2" opacity="0.4" />
    <line x1="195" y1="215" x2="200" y2="300" stroke="#475569" stroke-width="1.2" opacity="0.4" />
    <line x1="225" y1="230" x2="235" y2="300" stroke="#475569" stroke-width="1.2" opacity="0.4" />

    <!-- Crisp White Shirt Collar -->
    <polygon points="150,225 125,188 150,192" fill="#ffffff" />
    <polygon points="150,225 175,188 150,192" fill="#f1f5f9" />
    <line x1="150" y1="192" x2="150" y2="225" stroke="#cbd5e1" stroke-width="1" />

    <!-- Striped Silk Tie -->
    <polygon points="144,195 156,195 160,250 150,285 140,250" fill="url(#tiePattern)" />
    <!-- Tie Knot -->
    <polygon points="143,192 157,192 154,208 146,208" fill="#92400e" />
  </g>

  <!-- Neck -->
  <rect x="135" y="150" width="30" height="46" rx="8" fill="url(#skinGrad)" />
  <path d="M 135 155 Q 150 172 165 155 L 165 195 L 135 195 Z" fill="#fbcfe8" opacity="0.3" />

  <!-- Head / Face -->
  <ellipse cx="150" cy="116" rx="46" ry="54" fill="url(#skinGrad)" filter="url(#softShadow)" />

  <!-- Ears -->
  <ellipse cx="104" cy="120" rx="6" ry="12" fill="#fed7aa" />
  <ellipse cx="196" cy="120" rx="6" ry="12" fill="#fed7aa" />

  <!-- Hair - Clean side-parted black hair matching photo -->
  <path d="M 102 110 C 98 70 120 50 150 50 C 180 50 202 70 198 110 C 190 94 180 84 165 86 C 150 88 142 80 130 80 C 118 80 110 92 102 110 Z" fill="#0f172a" />
  <path d="M 120 78 Q 140 64 160 70" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 148 68 Q 165 62 182 76" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Eyebrows -->
  <path d="M 120 102 Q 131 99 140 103" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M 160 103 Q 169 99 180 102" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" fill="none" />

  <!-- Eyes with lively catchlight -->
  <g>
    <ellipse cx="131" cy="113" rx="4.5" ry="5" fill="#0f172a" />
    <circle cx="133" cy="111" r="1.5" fill="#ffffff" />
    <ellipse cx="169" cy="113" rx="4.5" ry="5" fill="#0f172a" />
    <circle cx="171" cy="111" r="1.5" fill="#ffffff" />
  </g>

  <!-- Nose -->
  <path d="M 150 110 L 147 128 L 154 130" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Gentle friendly scholarly smile -->
  <path d="M 140 144 Q 150 152 160 144" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>
