<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky & Atmosphere -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0c4de" />
      <stop offset="60%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Lake Water Gradient -->
    <linearGradient id="lakeWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4a3e" />
      <stop offset="40%" stop-color="#3b5d4f" />
      <stop offset="100%" stop-color="#1f362c" />
    </linearGradient>

    <!-- Lawn Gradient -->
    <linearGradient id="lawnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7c0f" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>

    <!-- Building Concrete Gradients -->
    <linearGradient id="bldgWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="roofTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c28e67" />
      <stop offset="100%" stop-color="#9a6742" />
    </linearGradient>

    <linearGradient id="glassWindow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Viaduct Track -->
    <linearGradient id="viaductGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="280" fill="url(#skyGrad)" />

  <!-- Distant City Skyline & High-rises (Wuhan urban backdrop) -->
  <g fill="#94a3b8" opacity="0.6">
    <!-- Left towers -->
    <rect x="50" y="30" width="45" height="180" rx="2" />
    <rect x="110" y="20" width="55" height="190" rx="2" />
    <rect x="180" y="50" width="40" height="160" rx="2" />
    <rect x="230" y="40" width="50" height="170" rx="2" />
    <rect x="330" y="70" width="45" height="140" rx="2" />
    <rect x="420" y="80" width="50" height="130" rx="2" />
    <!-- Center distant towers -->
    <rect x="520" y="60" width="40" height="150" rx="2" />
    <rect x="580" y="45" width="48" height="165" rx="2" />
    <rect x="650" y="75" width="42" height="135" rx="2" />
    <rect x="730" y="55" width="50" height="155" rx="2" />
    <rect x="850" y="70" width="45" height="140" rx="2" />
    <rect x="940" y="40" width="55" height="170" rx="2" />
    <rect x="1010" y="60" width="48" height="150" rx="2" />
    <!-- Right towers -->
    <rect x="1080" y="50" width="50" height="160" rx="2" />
    <rect x="1150" y="30" width="60" height="180" rx="2" />
    <rect x="1230" y="65" width="45" height="145" rx="2" />
    <rect x="1290" y="45" width="52" height="165" rx="2" />
    <rect x="1360" y="75" width="40" height="135" rx="2" />
    <rect x="1420" y="55" width="65" height="155" rx="2" />
    <rect x="1500" y="85" width="55" height="125" rx="2" />
  </g>

  <!-- Midground Dense Forest Canopy -->
  <path d="M 0 210 Q 300 190 700 205 T 1600 200 L 1600 270 L 0 270 Z" fill="#15803d" opacity="0.9" />

  <!-- Elevated Light Rail / Metro Viaduct Corridor -->
  <g>
    <!-- Viaduct bridge body -->
    <rect x="0" y="215" width="1600" height="28" fill="url(#viaductGrad)" />
    <!-- Pillars -->
    <rect x="120" y="243" width="18" height="40" fill="#64748b" />
    <rect x="320" y="243" width="18" height="40" fill="#64748b" />
    <rect x="520" y="243" width="18" height="40" fill="#64748b" />
    <rect x="720" y="243" width="18" height="40" fill="#64748b" />
    <rect x="920" y="243" width="18" height="40" fill="#64748b" />
    <rect x="1120" y="243" width="18" height="40" fill="#64748b" />
    <rect x="1320" y="243" width="18" height="40" fill="#64748b" />
    <rect x="1500" y="243" width="18" height="40" fill="#64748b" />
    <!-- Sound barrier / overhead structure -->
    <rect x="0" y="208" width="1600" height="8" fill="#94a3b8" />
    <line x1="0" y1="212" x2="1600" y2="212" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Campus Green Belt behind building -->
  <rect x="0" y="250" width="1600" height="100" fill="#166534" />
  <!-- Tree clusters -->
  <g fill="#14532d">
    <circle cx="100" cy="270" r="35" />
    <circle cx="160" cy="280" r="30" />
    <circle cx="240" cy="275" r="40" />
    <circle cx="340" cy="285" r="35" />
    <circle cx="1280" cy="280" r="40" />
    <circle cx="1360" cy="275" r="35" />
    <circle cx="1440" cy="290" r="45" />
    <circle cx="1520" cy="280" r="35" />
  </g>

  <!-- ==================== MAIN SIGNATURE BUILDING (Huazhong University of Science & Technology) ==================== -->
  <g filter="url(#drop)">
    <!-- Back wings projecting north -->
    <rect x="490" y="235" width="75" height="130" fill="url(#bldgWhite)" stroke="#94a3b8" stroke-width="2" />
    <rect x="495" y="238" width="65" height="120" fill="url(#roofTile)" />

    <rect x="670" y="235" width="70" height="130" fill="url(#bldgWhite)" stroke="#94a3b8" stroke-width="2" />
    <rect x="675" y="238" width="60" height="120" fill="url(#roofTile)" />

    <rect x="850" y="235" width="70" height="130" fill="url(#bldgWhite)" stroke="#94a3b8" stroke-width="2" />
    <rect x="855" y="238" width="60" height="120" fill="url(#roofTile)" />

    <rect x="1030" y="235" width="75" height="130" fill="url(#bldgWhite)" stroke="#94a3b8" stroke-width="2" />
    <rect x="1035" y="238" width="65" height="120" fill="url(#roofTile)" />

    <!-- Left Main Wing Block -->
    <polygon points="340,320 450,290 470,410 360,450" fill="url(#bldgWhite)" stroke="#94a3b8" stroke-width="2" />
    <polygon points="348,324 445,296 462,402 368,440" fill="url(#roofTile)" />
    <!-- Left Wing Front Facade -->
    <polygon points="360,450 470,410 470,550 360,590" fill="url(#bldgWhite)" />
    <!-- Window grid on left wing -->
    <g fill="#334155" opacity="0.8">
      <rect x="375" y="470" width="16" height="22" rx="1" />
      <rect x="400" y="465" width="16" height="22" rx="1" />
      <rect x="425" y="460" width="16" height="22" rx="1" />
      <rect x="375" y="505" width="16" height="22" rx="1" />
      <rect x="400" y="500" width="16" height="22" rx="1" />
      <rect x="425" y="495" width="16" height="22" rx="1" />
      <rect x="375" y="540" width="16" height="22" rx="1" />
      <rect x="400" y="535" width="16" height="22" rx="1" />
      <rect x="425" y="530" width="16" height="22" rx="1" />
    </g>

    <!-- Right Main Wing Block -->
    <polygon points="1260,320 1150,290 1130,410 1240,450" fill="url(#bldgWhite)" stroke="#94a3b8" stroke-width="2" />
    <polygon points="1252,324 1155,296 1138,402 1232,440" fill="url(#roofTile)" />
    <!-- Right Wing Front Facade with building name -->
    <polygon points="1240,450 1130,410 1130,550 1240,590" fill="url(#bldgWhite)" />
    <!-- Window grid on right wing -->
    <g fill="#334155" opacity="0.8">
      <rect x="1150" y="460" width="16" height="22" rx="1" />
      <rect x="1175" y="465" width="16" height="22" rx="1" />
      <rect x="1200" y="470" width="16" height="22" rx="1" />
      <rect x="1150" y="495" width="16" height="22" rx="1" />
      <rect x="1175" y="500" width="16" height="22" rx="1" />
      <rect x="1200" y="505" width="16" height="22" rx="1" />
      <rect x="1150" y="530" width="16" height="22" rx="1" />
      <rect x="1175" y="535" width="16" height="22" rx="1" />
      <rect x="1200" y="540" width="16" height="22" rx="1" />
    </g>

    <!-- Grand Sweeping Curved Central Building Body -->
    <!-- Curved Roof -->
    <path d="M 450 290 Q 800 350 1150 290 L 1130 410 Q 800 470 470 410 Z" fill="url(#roofTile)" stroke="#78350f" stroke-width="1.5" />
    <!-- Curved Facade with Ribbon Glass Windows -->
    <path d="M 470 410 Q 800 470 1130 410 L 1130 480 Q 800 540 470 480 Z" fill="url(#bldgWhite)" />
    <!-- Upper Glass Ribbon -->
    <path d="M 480 422 Q 800 480 1120 422 L 1120 436 Q 800 494 480 436 Z" fill="url(#glassWindow)" />
    <!-- Middle Glass Ribbon -->
    <path d="M 480 445 Q 800 503 1120 445 L 1120 459 Q 800 517 480 459 Z" fill="url(#glassWindow)" />
    <!-- Lower Glass Ribbon -->
    <path d="M 485 468 Q 800 526 1115 468 L 1115 480 Q 800 538 485 480 Z" fill="url(#glassWindow)" />

    <!-- Ground Floor Open Colonnade Pillars -->
    <g fill="#64748b">
      <rect x="530" y="475" width="6" height="25" />
      <rect x="580" y="482" width="6" height="25" />
      <rect x="630" y="489" width="6" height="25" />
      <rect x="680" y="495" width="6" height="25" />
      <rect x="730" y="500" width="6" height="25" />
      <rect x="780" y="503" width="6" height="25" />
      <rect x="820" y="503" width="6" height="25" />
      <rect x="870" y="500" width="6" height="25" />
      <rect x="920" y="495" width="6" height="25" />
      <rect x="970" y="489" width="6" height="25" />
      <rect x="1020" y="482" width="6" height="25" />
      <rect x="1070" y="475" width="6" height="25" />
    </g>
  </g>

  <!-- Central Plaza Courtyard with Pavement & Bicycle Parking lines -->
  <path d="M 470 480 Q 800 540 1130 480 L 1090 620 Q 800 660 510 620 Z" fill="#e2e8f0" />
  <!-- Courtyard pathways & flowerbeds -->
  <g fill="#cbd5e1">
    <ellipse cx="600" cy="550" rx="35" ry="18" fill="#15803d" />
    <ellipse cx="1000" cy="550" rx="35" ry="18" fill="#15803d" />
  </g>
  <!-- Bicycle rows -->
  <g stroke="#94a3b8" stroke-width="1.5" opacity="0.6">
    <line x1="680" y1="530" x2="680" y2="580" />
    <line x1="710" y1="535" x2="710" y2="585" />
    <line x1="740" y1="540" x2="740" y2="590" />
    <line x1="860" y1="540" x2="860" y2="590" />
    <line x1="890" y1="535" x2="890" y2="585" />
    <line x1="920" y1="530" x2="920" y2="580" />
  </g>

  <!-- ==================== CURVED GREEN LAWN EMBANKMENT WITH "华中科技大学" ==================== -->
  <!-- Upper terrace trees and green landscaping -->
  <path d="M 320 600 Q 800 670 1280 600 L 1340 680 Q 800 750 260 680 Z" fill="#166534" />
  <!-- Shrubs lining -->
  <g fill="#15803d">
    <circle cx="360" cy="625" r="16" />
    <circle cx="410" cy="635" r="18" />
    <circle cx="470" cy="645" r="17" />
    <circle cx="1130" cy="645" r="17" />
    <circle cx="1190" cy="635" r="18" />
    <circle cx="1240" cy="625" r="16" />
  </g>

  <!-- Grand Sloped Floral Lawn -->
  <path d="M 260 670 Q 800 745 1340 670 L 1390 750 Q 800 830 210 750 Z" fill="url(#lawnGrad)" />

  <!-- Concrete Lake Shoreline Retaining Wall -->
  <path d="M 210 745 Q 800 825 1390 745 L 1395 765 Q 800 845 205 765 Z" fill="#94a3b8" />
  <path d="M 205 765 Q 800 845 1395 765 L 1398 775 Q 800 855 202 775 Z" fill="#475569" />

  <!-- ==================== ICONIC TEXT "华 中 科 技 大 学" ON LAWN ==================== -->
  <!-- Deep burgundy/purple-red trimmed shrub letters matching the aerial photo exactly -->
  <g font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif', 'SimSun', serif" font-weight="900" font-size="52" fill="#581c87" stroke="#3b0764" stroke-width="2">
    <!-- Character 1: 华 -->
    <text x="410" y="738" transform="rotate(18, 410, 738)" filter="url(#drop)">华</text>

    <!-- Character 2: 中 -->
    <text x="545" y="768" transform="rotate(10, 545, 768)" filter="url(#drop)">中</text>

    <!-- Character 3: 科 -->
    <text x="695" y="784" transform="rotate(3, 695, 784)" filter="url(#drop)">科</text>

    <!-- Character 4: 技 -->
    <text x="840" y="784" transform="rotate(-3, 840, 784)" filter="url(#drop)">技</text>

    <!-- Character 5: 大 -->
    <text x="985" y="768" transform="rotate(-10, 985, 768)" filter="url(#drop)">大</text>

    <!-- Character 6: 学 -->
    <text x="1120" y="738" transform="rotate(-18, 1120, 738)" filter="url(#drop)">学</text>
  </g>

  <!-- Bright top highlight on the shrub letters -->
  <g font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif', 'SimSun', serif" font-weight="900" font-size="52" fill="#7e22ce" opacity="0.6">
    <text x="409" y="736" transform="rotate(18, 410, 738)">华</text>
    <text x="544" y="766" transform="rotate(10, 545, 768)">中</text>
    <text x="694" y="782" transform="rotate(3, 695, 784)">科</text>
    <text x="839" y="782" transform="rotate(-3, 840, 784)">技</text>
    <text x="984" y="766" transform="rotate(-10, 985, 768)">大</text>
    <text x="1119" y="736" transform="rotate(-18, 1120, 738)">学</text>
  </g>

  <!-- ==================== FOREGROUND EAST NINE LAKE WATER (东九湖) ==================== -->
  <path d="M 0 760 Q 800 855 1600 760 L 1600 900 L 0 900 Z" fill="url(#lakeWater)" />

  <!-- Lotus Leaves Patch in Lower-Left Corner (荷叶群) -->
  <g fill="#166534" stroke="#14532d" stroke-width="1">
    <circle cx="40" cy="810" r="16" />
    <circle cx="70" cy="805" r="19" />
    <circle cx="105" cy="815" r="17" />
    <circle cx="50" cy="840" r="22" />
    <circle cx="90" cy="845" r="24" />
    <circle cx="135" cy="830" r="20" />
    <circle cx="45" cy="875" r="26" />
    <circle cx="95" cy="880" r="28" />
    <circle cx="150" cy="865" r="22" />
    <circle cx="180" cy="885" r="20" />
    <!-- Light lotus leaf veins -->
    <circle cx="52" cy="838" r="4" fill="#4ade80" opacity="0.4" />
    <circle cx="92" cy="843" r="5" fill="#4ade80" opacity="0.4" />
    <circle cx="97" cy="878" r="6" fill="#4ade80" opacity="0.4" />
  </g>

  <!-- Gentle water ripples and reflections of the building on the lake -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.25" stroke-linecap="round">
    <line x1="600" y1="820" x2="720" y2="820" />
    <line x1="880" y1="820" x2="1000" y2="820" />
    <line x1="650" y1="845" x2="810" y2="845" />
    <line x1="840" y1="850" x2="960" y2="850" />
    <line x1="720" y1="870" x2="880" y2="870" />
    <line x1="450" y1="835" x2="550" y2="835" />
    <line x1="1100" y1="830" x2="1220" y2="830" />
  </g>

  <!-- Surrounding Trees in lower right -->
  <g fill="#15803d">
    <circle cx="1450" cy="790" r="45" />
    <circle cx="1520" cy="830" r="50" />
    <circle cx="1580" cy="790" r="45" />
  </g>
</svg>
