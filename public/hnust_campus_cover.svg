<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Twilight Gradient -->
    <linearGradient id="twilightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64788c" />
      <stop offset="25%" stop-color="#8a9cae" />
      <stop offset="55%" stop-color="#c8b4b4" />
      <stop offset="78%" stop-color="#f2cdb6" />
      <stop offset="100%" stop-color="#fbe4d6" />
    </linearGradient>

    <!-- Lake Water Gradient -->
    <linearGradient id="lakeWaterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3d36" />
      <stop offset="20%" stop-color="#22332c" />
      <stop offset="60%" stop-color="#18241f" />
      <stop offset="100%" stop-color="#0f1714" />
    </linearGradient>

    <!-- Embankment Stone Gradient -->
    <linearGradient id="embankmentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6058" />
      <stop offset="50%" stop-color="#4e453f" />
      <stop offset="100%" stop-color="#38312c" />
    </linearGradient>

    <!-- Building Concrete & Panels -->
    <linearGradient id="bldgWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="bldgBluePanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#73899f" />
      <stop offset="50%" stop-color="#8fa3b8" />
      <stop offset="100%" stop-color="#697f95" />
    </linearGradient>

    <linearGradient id="curvedGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Gold Text Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#805600" flood-opacity="0.7" />
    </filter>

    <!-- Water Ripple Filter for Reflection -->
    <filter id="waterRipple" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.08" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- ================= 1. SKY BACKGROUND ================= -->
  <rect x="0" y="0" width="1920" height="570" fill="url(#twilightSky)" />

  <!-- Distant campus hill and trees on horizon -->
  <path d="M0 540 Q 200 520, 400 528 T 900 525 T 1400 518 T 1920 535 L 1920 570 L 0 570 Z" fill="#475549" opacity="0.6" />

  <!-- ================= 2. HNUST YIFU TEACHING BUILDING (逸夫教学楼) ================= -->
  <g id="yifu-building">
    <!-- Left Wing (5 Floors) -->
    <path d="M 40 330 L 290 350 L 290 530 L 40 525 Z" fill="#e2e8f0" />
    <path d="M 40 330 L 150 340 L 150 525 L 40 525 Z" fill="url(#bldgBluePanel)" />

    <!-- Left Wing Windows -->
    <g fill="#334155" opacity="0.85">
      <rect x="60" y="360" width="25" height="28" rx="2" />
      <rect x="100" y="360" width="30" height="28" rx="2" />
      <rect x="60" y="400" width="25" height="28" rx="2" />
      <rect x="100" y="400" width="30" height="28" rx="2" />
      <rect x="60" y="440" width="25" height="28" rx="2" />
      <rect x="100" y="440" width="30" height="28" rx="2" />
      <rect x="60" y="480" width="25" height="28" rx="2" />
      <rect x="100" y="480" width="30" height="28" rx="2" />

      <rect x="165" y="370" width="35" height="30" rx="2" />
      <rect x="215" y="372" width="35" height="30" rx="2" />
      <rect x="165" y="410" width="35" height="30" rx="2" />
      <rect x="215" y="412" width="35" height="30" rx="2" />
      <rect x="165" y="450" width="35" height="30" rx="2" />
      <rect x="215" y="452" width="35" height="30" rx="2" />
      <rect x="165" y="490" width="35" height="30" rx="2" />
      <rect x="215" y="492" width="35" height="30" rx="2" />
    </g>

    <!-- Sweeping Curved Central Concourse -->
    <!-- Base structure with curved perspective -->
    <path d="M 285 400 Q 750 435, 1340 375 L 1340 520 Q 750 535, 285 530 Z" fill="#e8edf2" />

    <!-- Open ground-floor colonnade breezeway under curved hall -->
    <g fill="#2b3b33">
      <!-- Breezeway pillars and background landscape showing through -->
      <rect x="350" y="490" width="10" height="35" fill="#475569" />
      <rect x="440" y="492" width="10" height="35" fill="#475569" />
      <rect x="540" y="494" width="10" height="35" fill="#475569" />
      <rect x="640" y="496" width="10" height="35" fill="#475569" />
      <rect x="740" y="497" width="10" height="35" fill="#475569" />
      <rect x="850" y="496" width="10" height="35" fill="#475569" />
      <rect x="960" y="494" width="10" height="35" fill="#475569" />
      <rect x="1080" y="490" width="10" height="35" fill="#475569" />
      <rect x="1200" y="485" width="10" height="35" fill="#475569" />
    </g>

    <!-- Curved ribbon glass windows (4 continuous horizontal bands) -->
    <g fill="url(#curvedGlass)" stroke="#64748b" stroke-width="0.8">
      <!-- Floor 4 -->
      <path d="M 290 412 Q 750 443, 1335 385 L 1335 400 Q 750 458, 290 427 Z" />
      <!-- Floor 3 -->
      <path d="M 290 432 Q 750 463, 1335 405 L 1335 420 Q 750 478, 290 447 Z" />
      <!-- Floor 2 -->
      <path d="M 290 452 Q 750 483, 1335 425 L 1335 440 Q 750 498, 290 467 Z" />
      <!-- Floor 1 -->
      <path d="M 290 472 Q 750 503, 1335 445 L 1335 460 Q 750 518, 290 487 Z" />
    </g>

    <!-- Vertical mullions across the curved glass -->
    <g stroke="#94a3b8" stroke-width="1" opacity="0.6">
      <line x1="360" y1="418" x2="360" y2="482" />
      <line x1="420" y1="424" x2="420" y2="489" />
      <line x1="480" y1="429" x2="480" y2="494" />
      <line x1="550" y1="434" x2="550" y2="499" />
      <line x1="620" y1="438" x2="620" y2="503" />
      <line x1="700" y1="441" x2="700" y2="506" />
      <line x1="780" y1="442" x2="780" y2="507" />
      <line x1="860" y1="440" x2="860" y2="505" />
      <line x1="940" y1="436" x2="940" y2="501" />
      <line x1="1020" y1="430" x2="1020" y2="495" />
      <line x1="1100" y1="422" x2="1100" y2="487" />
      <line x1="1180" y1="412" x2="1180" y2="477" />
      <line x1="1260" y1="400" x2="1260" y2="465" />
    </g>

    <!-- Right Wing & Tower (Prominent 逸夫教学楼 Tower) -->
    <!-- Tower Main Mass -->
    <path d="M 1290 290 L 1780 170 L 1780 480 L 1280 520 Z" fill="#dbe3eb" />
    <!-- Tower Right Facade with Blue Accent Band -->
    <path d="M 1460 250 L 1780 170 L 1780 480 L 1460 500 Z" fill="url(#bldgBluePanel)" />
    <path d="M 1390 270 L 1460 250 L 1460 500 L 1390 510 Z" fill="#eef3f8" />

    <!-- Tower Window Grids -->
    <g fill="#273646" opacity="0.9">
      <!-- Right Wing Modern Square Windows -->
      <rect x="1590" y="195" width="70" height="35" rx="2" />
      <rect x="1600" y="250" width="60" height="35" rx="2" />
      <rect x="1600" y="305" width="60" height="35" rx="2" />
      <rect x="1600" y="360" width="60" height="35" rx="2" />
      <rect x="1600" y="415" width="60" height="35" rx="2" />

      <!-- Left strip of the right wing -->
      <rect x="1330" y="320" width="30" height="28" rx="1" />
      <rect x="1330" y="360" width="30" height="28" rx="1" />
      <rect x="1330" y="400" width="30" height="28" rx="1" />
      <rect x="1330" y="440" width="30" height="28" rx="1" />
      <rect x="1330" y="480" width="30" height="28" rx="1" />
    </g>

    <!-- GOLDEN CHINESE CALLIGRAPHIC INSCRIPTION: 逸夫教学楼 -->
    <g font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-weight="900" font-size="34" fill="#dfab28" stroke="#8c6200" stroke-width="0.8" filter="url(#goldGlow)" text-anchor="middle">
      <text x="1525" y="260">逸</text>
      <text x="1525" y="308">夫</text>
      <text x="1525" y="356">教</text>
      <text x="1525" y="404">学</text>
      <text x="1525" y="452">楼</text>
    </g>
  </g>

  <!-- ================= 3. LANDSCAPED HILLSIDE, TREES & BALUSTRADE ================= -->
  <!-- Sloping green lawn and purple barberry shrubbery -->
  <path d="M 0 520 Q 500 500, 1000 508 T 1920 485 L 1920 545 L 0 550 Z" fill="#364e37" />
  <path d="M 0 535 Q 600 515, 1200 515 T 1920 495 L 1920 555 L 0 560 Z" fill="#442a3a" opacity="0.9" />

  <!-- Autumn Ginkgo & Deciduous Trees along the Lake Embankment -->
  <g id="autumn-trees">
    <!-- Tree 1 -->
    <circle cx="830" cy="470" r="16" fill="#cca028" />
    <circle cx="840" cy="460" r="14" fill="#e5b835" />
    <line x1="835" y1="480" x2="835" y2="520" stroke="#3e2e1e" stroke-width="3" />

    <!-- Tree 2 -->
    <circle cx="920" cy="465" r="18" fill="#d99424" />
    <circle cx="930" cy="455" r="15" fill="#f0b23b" />
    <line x1="925" y1="480" x2="925" y2="520" stroke="#3e2e1e" stroke-width="3.5" />

    <!-- Tree 3 -->
    <circle cx="1010" cy="460" r="18" fill="#c47a1f" />
    <circle cx="1015" cy="450" r="15" fill="#e59835" />
    <line x1="1012" y1="475" x2="1012" y2="520" stroke="#3e2e1e" stroke-width="3.5" />

    <!-- Tree 4 -->
    <circle cx="1180" cy="435" r="22" fill="#d99424" />
    <circle cx="1190" cy="420" r="18" fill="#f2be44" />
    <line x1="1185" y1="450" x2="1185" y2="515" stroke="#3e2e1e" stroke-width="4" />

    <!-- Tree 5 (Beside Yifu Tower) -->
    <circle cx="1470" cy="395" r="26" fill="#c97e1a" />
    <circle cx="1480" cy="380" r="22" fill="#e8a32a" />
    <line x1="1475" y1="415" x2="1475" y2="495" stroke="#3e2e1e" stroke-width="4.5" />

    <!-- Tree 6 (Far right) -->
    <circle cx="1850" cy="360" r="38" fill="#88441b" />
    <circle cx="1870" cy="335" r="32" fill="#aa5c28" />
    <line x1="1860" y1="390" x2="1860" y2="480" stroke="#3e2e1e" stroke-width="6" />
  </g>

  <!-- White Stone Balustrade (White carved railing along the lake) -->
  <g id="white-balustrade">
    <!-- Top rail -->
    <rect x="0" y="538" width="1920" height="4" fill="#f1f5f9" />
    <!-- Posts & Railing pillars -->
    <path d="M 0 542 L 1920 542 L 1920 554 L 0 554 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" />
    <!-- Individual posts sequence -->
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="0.5">
      <rect x="20" y="532" width="8" height="22" rx="1" />
      <rect x="60" y="532" width="8" height="22" rx="1" />
      <rect x="100" y="532" width="8" height="22" rx="1" />
      <rect x="140" y="532" width="8" height="22" rx="1" />
      <rect x="180" y="532" width="8" height="22" rx="1" />
      <rect x="220" y="532" width="8" height="22" rx="1" />
      <rect x="260" y="532" width="8" height="22" rx="1" />
      <rect x="300" y="532" width="8" height="22" rx="1" />
      <rect x="350" y="532" width="8" height="22" rx="1" />
      <rect x="400" y="532" width="8" height="22" rx="1" />
      <rect x="460" y="532" width="8" height="22" rx="1" />
      <rect x="520" y="532" width="8" height="22" rx="1" />
      <rect x="580" y="532" width="8" height="22" rx="1" />
      <rect x="650" y="532" width="8" height="22" rx="1" />
      <rect x="720" y="532" width="8" height="22" rx="1" />
      <rect x="800" y="532" width="8" height="22" rx="1" />
      <rect x="880" y="532" width="8" height="22" rx="1" />
      <rect x="960" y="532" width="8" height="22" rx="1" />
      <rect x="1050" y="532" width="8" height="22" rx="1" />
      <rect x="1140" y="532" width="8" height="22" rx="1" />
      <rect x="1230" y="532" width="8" height="22" rx="1" />
      <rect x="1330" y="532" width="8" height="22" rx="1" />
      <rect x="1430" y="532" width="8" height="22" rx="1" />
      <rect x="1540" y="532" width="8" height="22" rx="1" />
      <rect x="1650" y="532" width="8" height="22" rx="1" />
      <rect x="1760" y="532" width="8" height="22" rx="1" />
      <rect x="1870" y="532" width="8" height="22" rx="1" />
    </g>
  </g>

  <!-- Masonry Stone Embankment (Cobblestone/rock lakeside slope) -->
  <rect x="0" y="554" width="1920" height="38" fill="url(#embankmentGrad)" />
  <g stroke="#26211c" stroke-width="1" opacity="0.4">
    <line x1="0" y1="565" x2="1920" y2="565" />
    <line x1="0" y1="578" x2="1920" y2="578" />
  </g>

  <!-- ================= 4. LAKE WATER & SYMMETRICAL REFLECTION ================= -->
  <!-- Deep water lake surface -->
  <rect x="0" y="592" width="1920" height="488" fill="url(#lakeWaterGrad)" />

  <!-- Mirrored Building Reflection (Inverted & gently blurred/rippled) -->
  <g opacity="0.65" transform="translate(0, 1184) scale(1, -1)">
    <!-- Mirrored Yifu Building -->
    <path d="M 40 330 L 290 350 L 290 530 L 40 525 Z" fill="#cbd5e1" opacity="0.7" />
    <path d="M 40 330 L 150 340 L 150 525 L 40 525 Z" fill="#64748b" opacity="0.7" />

    <!-- Mirrored Curved Concourse -->
    <path d="M 285 400 Q 750 435, 1340 375 L 1340 520 Q 750 535, 285 530 Z" fill="#cbd5e1" opacity="0.7" />
    <!-- Mirrored Glass Bands -->
    <path d="M 290 412 Q 750 443, 1335 385 L 1335 460 Q 750 518, 290 487 Z" fill="#475569" opacity="0.8" />

    <!-- Mirrored Tower -->
    <path d="M 1290 290 L 1780 170 L 1780 480 L 1280 520 Z" fill="#b0c0ce" opacity="0.7" />
    <path d="M 1460 250 L 1780 170 L 1780 480 L 1460 500 Z" fill="#586f85" opacity="0.7" />

    <!-- Mirrored Golden Calligraphy Reflection: 逸夫教学楼 -->
    <g font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-weight="900" font-size="34" fill="#d49b18" opacity="0.6" text-anchor="middle">
      <text x="1525" y="260">逸</text>
      <text x="1525" y="308">夫</text>
      <text x="1525" y="356">教</text>
      <text x="1525" y="404">学</text>
      <text x="1525" y="452">楼</text>
    </g>

    <!-- Mirrored Trees -->
    <circle cx="835" cy="465" r="16" fill="#b88c1d" opacity="0.8" />
    <circle cx="925" cy="460" r="18" fill="#b87819" opacity="0.8" />
    <circle cx="1012" cy="455" r="18" fill="#a86015" opacity="0.8" />
    <circle cx="1185" cy="430" r="22" fill="#c47d1a" opacity="0.8" />
    <circle cx="1475" cy="390" r="26" fill="#b86b12" opacity="0.8" />
  </g>

  <!-- Water Surface Ripple Bands & Atmospheric Glow -->
  <g fill="none" stroke="#f6d3ba" stroke-width="1.2" opacity="0.35">
    <ellipse cx="600" cy="620" rx="300" ry="1.5" />
    <ellipse cx="1100" cy="635" rx="400" ry="2" />
    <ellipse cx="1500" cy="650" rx="250" ry="1.8" />
    <ellipse cx="400" cy="680" rx="280" ry="1.5" />
    <ellipse cx="900" cy="720" rx="450" ry="2.5" />
    <ellipse cx="1400" cy="760" rx="350" ry="2.2" />
    <ellipse cx="700" cy="830" rx="500" ry="3" />
    <ellipse cx="1300" cy="900" rx="420" ry="3.5" />
  </g>

  <!-- ================= 5. FOREGROUND WATER REEDS (Authentic Photo Detail) ================= -->
  <!-- Slender reed stems poking through calm lake in foreground -->
  <g stroke="#9f8566" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- Left reed cluster -->
    <path d="M 460 1020 Q 450 920, 470 820 Q 480 770, 465 740" />
    <path d="M 470 820 Q 495 800, 520 780" />
    <path d="M 450 920 Q 430 870, 410 850" />
    <path d="M 485 1040 Q 500 960, 490 890" />
    <path d="M 490 890 Q 515 860, 530 840" />
    <path d="M 465 740 Q 455 720, 460 705" />

    <!-- Center reed stem -->
    <path d="M 850 1080 Q 845 990, 850 910" stroke-width="1.8" />
  </g>

  <!-- ================= 6. TOP OVERHANGING WILLOW/AUTUMN BRANCHES ================= -->
  <!-- Tree foliage framing from top edge -->
  <g stroke="#423326" stroke-width="2" fill="#7a6230" opacity="0.9">
    <path d="M 880 0 Q 940 70, 1020 110 Q 1100 150, 1160 180" />
    <path d="M 1020 110 Q 980 150, 970 210" />
    <path d="M 1100 150 Q 1150 200, 1200 230" />
    <path d="M 1160 180 Q 1140 220, 1130 255" />
    <path d="M 1300 0 Q 1380 90, 1420 140" />

    <!-- Delicate leaves on branches -->
    <circle cx="970" cy="210" r="5" fill="#a48235" stroke="none" />
    <circle cx="1000" cy="180" r="6" fill="#8c6a28" stroke="none" />
    <circle cx="1060" cy="170" r="5" fill="#9e7b2f" stroke="none" />
    <circle cx="1130" cy="255" r="6" fill="#a48235" stroke="none" />
    <circle cx="1200" cy="230" r="7" fill="#8c6a28" stroke="none" />
    <circle cx="1170" cy="190" r="5" fill="#a48235" stroke="none" />
    <circle cx="1420" cy="140" r="6" fill="#7b5d24" stroke="none" />
    <circle cx="1380" cy="110" r="7" fill="#8c6a28" stroke="none" />
  </g>
</svg>
